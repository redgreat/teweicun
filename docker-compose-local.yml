name: twcapp
services:
  backend:
    build:
      context: .
      dockerfile: DockerfileLocal
    container_name: twc-backend
    hostname: twc-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - twc-network
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/api/v1/health || exit 1" ]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
    cpus: 2.0
    mem_limit: 4G
    mem_reservation: 256m
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build: ./frontend
    container_name: twc-frontend
    hostname: twc-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      TZ: Asia/Shanghai
      LANG: zh_CN.UTF-8
    ports:
      - "3000:3000"
    networks:
      - twc-network
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1" ]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
    cpus: 1.0
    mem_limit: 2G
    mem_reservation: 128m
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  twc-network:
    driver: bridge