services:
  app:
    image: ghcr.io/redgreat/teweicun:latest
    container_name: twc
    hostname: twc
    restart: unless-stopped
    command: ["./main", "-c", "/app/configs/config.yaml"]

    environment:
      - TZ=Asia/Shanghai
      - LANG=zh_CN.UTF-8

    ports:
      - "8080:8080"
    volumes:
      - ./configs:/app/configs:ro
      - ./uploads:/app/uploads
      - ./logs:/var/log/teweicun
    networks:
      - twc-network

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v1/health || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s

    cpus: 2.0
    mem_limit: 4G
    mem_reservation: 512m

    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  twc-network:
    driver: bridge
